# What people know about Phase 2 that the numbers cannot say, for the exit report (P2-09).
# `firebid-eval exit-p2` adds what its own measurements show (no pilot, no baseline,
# regressions, evidence missing or not rerun). Edit this file as gaps close or are found.

# Evidence recorded on or after this day was measured with all of Phase 2 in place.
phase2_complete_on: "2026-10-04"

# A Phase 1 suite's figures as the Phase 1 exit report recorded them, for a suite whose
# result file was not kept: what the regression check compares with.
phase1_recorded:
  doc_classification:
    recorded: "2026-10-01"
    drawing_number_accuracy: 0.5
    revision_accuracy: 0.5

# One line per finding from the assisted-mode pilot. Empty: the pilot has not run.
pilot_findings: []

security_review:
  summary: >-
    Quotations, outcomes, submission snapshots and the KPI instrumentation were reviewed on
    4 Oct 2026 (`docs/reports/phase2-security-review.md`). Dependency and code scans
    (pip-audit, npm audit, bandit) found nothing; semgrep, gitleaks and trivy were not run.
    The data inventory and the retention job now cover the Phase 2 entities: quotation file
    lines are cleared a year after a bid ends, and an outcome's competitor feedback is
    listed as personal data. No high or critical finding is open.
  findings:
    - finding: >-
        An outcome's free text (reasons, competitor feedback) is copied into the audit log,
        which is append-only and kept seven years
      severity: medium
      status: >-
        open: say on the page not to name individuals; decide with the DPO whether the
        audit event holds the text
    - finding: >-
        Without a snapshot bucket configured, submission snapshots are written with no
        object lock: tampering is detected by the hashes, not prevented
      severity: medium
      status: >-
        open: configure the locked bucket in every deployed environment and exercise the
        lock on the real store
    - finding: Quotation file lines, which can name a supplier's contact, were kept for ever
      severity: medium
      status: closed in P2-09 (retention rule)
    - finding: Retention periods are placeholders, to be confirmed against the records policy
      severity: low
      status: open
    - finding: semgrep, gitleaks and trivy have not run on the Phase 2 code
      severity: low
      status: "open: `make security`, or restore CI"

cost_review:
  summary: >-
    Not measurable yet. No provider key has been configured on any environment (decision D2
    is open), so every Phase 2 model route (specification reading, quotation extraction,
    clarification wording) has run on its rules or been emulated, and the AI cost per tender
    is zero by absence, not by economy. `firebid-eval compare-models` still scores a stand-in
    predictor rather than the route's models, so it produces no evidence about quality.
    No change to any route's chain or reasoning level is proposed. The provider game day was
    rerun with the Phase 2 routes: with the primary provider down, 12 routes were served by
    an approved fallback and 1 escalated cleanly.

gaps:
  - gap: "Match lines (FR-DSN-06) have been tried on one real floor: four sheets of one consultant"
    cause: >-
      On the four tenth-storey sheets of the MOH set, run on their extracted geometry, each
      match line and the sheet it continues on are found, and sheet 1's layout falls from
      514 heads to 372 on its own side (the estimators counted 346 there). The other 144
      sheets and other consultants' ways of marking a cut are untried. A match line that
      steps is followed as one straight line; a DXF whose pipes are coloured by layer gives
      no colour to judge by; nothing compares two sheets to check they took opposite sides.
    action: >-
      Run the rest of the MOH set and a second consultant's drawings; a person confirms
      each sheet's side on the Design page meanwhile.
  - gap: "The whole real set has been read once; its design basis has not been summarised"
    cause: >-
      All 148 sheets of the MOH set were uploaded to one bid. Every sheet read is Current
      with the right number, every readable sheet has a plan view, and about half have a
      scale their own grid dimensions verify. Four sheets failed for memory before the fix
      below and were not read again. The design basis and match lines across the whole set
      were not tallied, and no other consultant's drawings have been run.
    action: >-
      Read the four again; read the design basis for the set; lay out one whole floor and
      compare its head count with the estimators'.
  - gap: "Finishing a document still matches every symbol of the bid, though lightly now"
    cause: >-
      Matching symbols to legend rows runs once a document over every instance of the bid.
      With straight strokes, leaders and the screened base plan no longer candidates, the
      real set (148 one-sheet files) has 12,000 instances where it had 467,000, and a pass
      takes 4 seconds where it took 41. It is still a pass a document: about ten minutes
      of matching for that set, where it was a hundred.
    action: >-
      Match only what a document changed: its own instances, and the rest only against
      legend rows it added. That needs a stored digest of each instance's shape.
  - gap: "What a candidate symbol is was decided in the code, not by the estimators"
    cause: >-
      A straight stroke, a leader (an arrowhead and the strokes from its tip), and on a PDF
      a shape printed in a light grey (the screened base plan) are no longer candidate
      symbols: a real sheet has about 80 where it had 3,000. Nothing records what was set
      aside. A tender that shows existing services screened, or prints its services in
      grey, would lose those symbols without a word.
    action: >-
      Product owner and Senior Estimator: confirm the three rules, or say what else a
      candidate must be.
  - gap: "A lettered device drawn to other proportions than its legend sample matches no row"
    cause: >-
      The letters in a symbol are now part of what it is, so a box with FI in it is no
      longer claimed by another box's row. But the real set draws its lettered boxes to fit
      the plan: the legend's FI is 11 by 5.4 mm lying down, the plans' is 3.5 by 6 mm
      standing up. Their letters agree and their shapes do not (0.13 apart; the tolerance
      is 0.07), so about 170 FI, 100 SAP, 160 2SFH and 200 FS (which sit in a valve
      assembly) match no row. They are raised as unexplained, under their letters.
    action: >-
      Senior Estimator: say whether a box with a row's letters in it is that row's device
      whatever its proportions. Then hold the shape to a looser tolerance when letters of
      two characters or more agree.
  - gap: "Whether the real set's ticked circle is its ceiling strobe is not confirmed"
    cause: >-
      1,812 circles of 4 mm with four ticks about them, on 60 sheets, are now matched to
      "STROBE LIGHT (CEILING)", whose legend sample is drawn the same way at 2.8 mm. That
      is three times the set's 536 smoke detectors, which is many for strobes.
    action: >-
      Senior Estimator: say what the ticked circle is before the row is confirmed.
  - gap: "A proposal no legend row uses any more still claims symbols"
    cause: >-
      A proposed mapping is kept when a later reading of its legend no longer leads to it,
      and symbols no row claims are then matched to it. On the real bid seven such
      proposals, left by earlier readings and stored without letters, claim 1,172 symbols
      by shape alone. Nothing is counted from a proposal, but they are listed under its
      description.
    action: >-
      Decide whether a proposal with no legend row on any bid is withdrawn when its bid is
      read again.
  - gap: "Two thirds of a real tender's candidates match no legend row"
    cause: >-
      Of the real set's 12,088 candidates, 7,941 match no legend row or mapping, in 626
      groups, nearly all drawn in the services' red. The largest were looked at by eye.
      Some are pieces of a device drawn as several shapes that do not touch (a square, a
      half circle, a sounder's rays), so the device is matched by one piece or by none.
      Others are pipe fittings (elbows, tees, couplings) and valve assemblies, which no
      legend row shows. The largest group, 1,585 on every sheet, is an empty box that a
      lettered box's row claimed before letters were read.
    action: >-
      Senior Estimator: say whether fittings are counted. Then either join the pieces of
      one device, or name the groups by hand with "unlisted symbol".
  - gap: "The heaviest real sheet still takes 1.2 GB to find its symbols"
    cause: >-
      Reading a two-million-primitive sheet's linework fell from 1.6 GB to 0.6 GB and
      finding its symbol shapes from 2.1 GB to 1.2 GB, so it fits a parser job's 2 GiB. Two
      such sheets at once use most of the pool's 4 GiB.
    action: "Profile the symbol stage further if heavier sheets are met; the pool now restarts if killed."
  - gap: "A plan with no dimensions and no gridline in common with a proved sheet still needs a calibration"
    cause: >-
      On the real set 68 of 145 plans state a scale that nothing on them confirms (the upper
      floors carry no dimension). A sheet is now verified by the grid it shares with a sheet
      whose scale is proved, by its own dimensions or by a person's calibration: 62 of the 68
      are. Six are left: sheets with fewer than three gridline bubbles in a row whose spacing
      is known (the skewed wing, and two with none).
    action: >-
      Pilot runbook: calibrate those on a known length; one calibration then serves every
      sheet on the same gridlines. A bid's views are checked when a document finishes or a
      view is calibrated; a bid read before this has its views found again by "Read again"
      on the Documents page.
  - gap: "A real plan's grid names a place but is not shared between sheets"
    cause: >-
      Gridlines drawn dashed, a wing's at an angle, and lines labelled with a letter and a
      number are now found: 147 of the 148 real sheets have a grid and their points a grid
      reference (FR-VIS-07), 67 of them a second grid for the wing. A grid found from dashes
      gives no grid index, so detections on two real sheets are not matched by grid
      (FR-VIS-08): the building has several grids, and two places at one index would be
      counted once. One sheet (A03-B2-05) has none: its lettered lines run three ways.
    action: >-
      Product owner and Senior Estimator: decide whether a real sheet's grid may give an
      index, now that each block's lines are told apart by their labels.
  - gap: "A real sheet's DXF export is about 110 MB on disk"
    cause: >-
      A real A0 sheet has 1.5 million line segments. The export is now made by a job in
      about 20 seconds and kept; the PDF is 8 MB; the DXF travels as 4 MB compressed but
      unpacks to about 110 MB, as that much linework in a text format does.
    action: >-
      Product owner: accept, or offer the DXF of the layout alone, to be laid over the
      consultant's own CAD file.
  - gap: "CI has not run since P2-06: not on P2-07 to P2-09, the dependency refresh, the move to Python 3.14 or FR-DSN-05 and 06"
    cause: >-
      GitHub Actions refuses to start jobs: the account's payments have failed or its
      spending limit is reached.
    action: >-
      Fix the billing; re-run CI on main. Until then the evidence is local: `make check`,
      `make test-integration` and `make e2e` in the Dev Container.
  - gap: "The end-to-end tests do not open the Phase 2 pages"
    cause: >-
      The eleven end-to-end tests cover sign-in, the bid workspace, document intake and the
      workbench, and pass on the current stack. None opens Costing, Labour, Clarifications,
      Risk, Review or Design, and those pages were not walked through in a browser.
    action: "Add an end-to-end test that takes a bid from pricing to G4; walk the pages before the pilot."
  - gap: "Title block reading measures 100% here and measured 50% in the Phase 1 report"
    cause: >-
      The suite's scanned tenders need Tesseract. The Phase 1 report was generated where it
      was not installed; this one in the Dev Container, where it is. The reader is unchanged.
    action: "None: generate the reports in the Dev Container."
  - gap: "No model route has run against a real provider"
    cause: "No API key on any environment; decision D2 (provider data terms and hosting) is open."
    action: >-
      Sponsor: decide D2. Then run the routes on the golden set, measure cost per tender by
      route, and only then compare models.
  - gap: "`firebid-eval compare-models` does not call the route's models"
    cause: "It scores a stand-in predictor: it proves the harness, not a model."
    action: "Give it a route-backed predictor once a provider key exists."
  - gap: "No golden set for Phase 2: equipment, pricing, labour and clarifications are measured on synthetic tenders"
    cause: "Decision D3's historical tenders have not been collected."
    action: "Collect them; import under `eval/truth`; re-run the suites and this report."
  - gap: "The clarification acceptance measure starts with clarifications drafted from P2-09 on"
    cause: >-
      The drafted wording is recorded from this step. A clarification drafted earlier has
      no draft on record and is counted as issued, not measured.
    action: "None needed: the pilot's clarifications will all be measured."
  - gap: "Turnaround is measured from the day the bid is opened on the platform"
    cause: >-
      The bid has no separate date for when the tender documents were received. Where a
      bid is opened late, the measured turnaround is shorter than the true one.
    action: >-
      Pilot runbook: open the bid on the day the tender arrives. If that proves
      unreliable, add a received date to the bid.
  - gap: "The baseline turnaround is not recorded"
    cause: "Business track: working days per tender before the platform have not been measured."
    action: "Estimating Manager: record it in `config/kpi.yaml`."
  - gap: "The load test opens the Phase 2 pages on bids that are taken off but not yet priced"
    cause: >-
      It measures the pages under ten bids being parsed, not a full estimate on each. The
      scale of a full estimate is measured in process (`make p2-benchmark`: 5,000 bill lines).
    action: "Extend the load test to price and draft on each bid once the pilot shows typical sizes."
  - gap: "Accepted risk allowances are shown beside the estimate, not in it"
    cause: "P2-07 and P2-08 left the cost build-up without a risk component."
    action: "Product owner: decide whether an accepted allowance becomes a build-up component."
  - gap: "The priced client workbook is not among the frozen submission's files"
    cause: "P2-08 freezes the company bill, the review pack, the qualifications and the clarification register."
    action: "Add the priced client workbook to the snapshot before the pilot's first submission."
  - gap: "Decision D5 (named approvers for the gates) is open"
    cause: "The gates are approved by role, from the permission matrix."
    action: "Sponsor: name the approvers, or confirm that the role is enough."
  - gap: "Business figures are placeholders"
    cause: >-
      `pricing.yaml`, `labour.yaml`, `clarifications.yaml`, `risk.yaml`, `scope_matrix.yaml`,
      `kpi.yaml` and `retention.yaml` carry values marked to be confirmed.
    action: "Estimating Manager and Commercial Director: confirm each before the pilot."
  - gap: "The accepted baseline for the Phase 2 systems suite was approved by the build step"
    cause: "`eval/baselines/p2_systems.json` names P2-01 as its approver."
    action: "Product owner: review and accept it under their own name."

recommendation: >-
  **Not ready to pass the gate; ready for the assisted-mode pilot.** The platform does what
  Phase 2 asked of it, and every Phase 2 requirement has a test: the
  estimate is priced with a source on every price (the database refuses one without), labour
  is estimated, clarifications, risks and qualifications are drafted for people to decide,
  the review pack and gates G3 and G4 work, and the submission is frozen and verifiable. The
  Phase 1 suites show no regression and the non-functional targets hold with the Phase 2
  workload. But none of the three exit criteria can be judged: they are measures of live
  tenders, and no pilot has run and no turnaround baseline exists. Recommended: (1) fix CI
  billing and run the full pipeline on main; (2) decide D2 so the model routes can be
  measured and costed; (3) record the turnaround baseline and confirm the placeholder
  figures; (4) make finishing a document scale with a tender sent as many files, then take
  a whole floor of the real set to a layout and compare it with the estimators' count;
  (5) run the assisted-mode pilot on at least three live tenders and regenerate this report with `make exit-report-p2 LIVE=1`. Hold the gate
  review until that report shows the three criteria measured.
