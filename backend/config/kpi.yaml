# Phase 1 KPIs (requirements §14) and the AI cost target (NFR-15), for the KPI dashboard and
# the Phase 1 exit report (P1-11).
#
# "TO BE CONFIRMED": the target cost per tender was to be set in Phase 0 and was not. This is
# a placeholder the sponsor replaces; until then every comparison against it says so.

status: to be confirmed

targets:
  sprinkler_count_accuracy: {at_least: 0.98}
  pipe_length_error: {at_most: 0.05}
  missed_item_rate: {at_most: 0.05}
  false_detection_rate: {at_most: 0.05}
  duplicate_detection_rate: {at_least: 0.95}
  qto_effort_reduction: {at_least: 0.30}
  workflow_success_rate: {at_least: 0.98}

# Phase 2 KPIs (requirements §14; P2-09).
phase2:
  targets:
    turnaround_reduction: {at_least: 0.30}
    price_provenance: {at_least: 1.0}
    clarification_acceptance: {at_least: 0.70}
  # Working days from receipt to submission-ready, before the platform: the figure the
  # turnaround is compared with. Not yet measured (business track): until it is, the
  # reduction is reported as pending.
  baseline_turnaround_working_days: null
  # A clarification was issued "with only minor edits" when no more than this share of its
  # drafted words was changed.
  clarification_minor_edit_ratio: 0.20
  # Public holidays, as dates, left out of working days. Empty: weekends only.
  holidays: []

# AI processing cost per tender, SGD (NFR-15). Placeholder.
target_cost_per_tender_sgd: 50.00
