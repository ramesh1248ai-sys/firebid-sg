[project]
name = "firebid"
version = "0.1.0"
description = "FireBid SG: AI-assisted tendering and pre-construction platform for Singapore fire protection contractors"
readme = "README.md"
authors = [
    { name = "Ramesh R", email = "ramesh1248@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "boto3>=1.43.99",
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "ezdxf>=1.3",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "matplotlib>=3.9",
    "openai>=3.19.0",
    "openpyxl>=3.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pillow>=12.3.0",
    "procrastinate>=3.9.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-multipart>=0.0.20",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "shapely>=2.1.2",
    "pyarrow>=25.0.1",
    "networkx>=3.4",
]

[project.scripts]
firebid-eval = "firebid.evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
    "types-defusedxml>=0.7.0.20240218",
    "types-networkx>=3.6.1.20260911",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Migrations are generated; keep them close to Alembic's output.
"src/firebid/db/migrations/versions/*" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "../scripts"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["boto3.*", "botocore.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ezdxf is typed but declares no __all__, so strict mode rejects its own documented API
# (ezdxf.new, ezdxf.readfile, the drawing add-on). Scoped to ezdxf so nothing else relaxes.
module = ["ezdxf.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration and not live'"
markers = [
    "req(id): the requirement ID this test verifies, e.g. @pytest.mark.req('FR-QTO-08')",
    "integration: needs the running local stack (make up); run with make test-integration",
    "live: calls a real LLM provider; costs money, needs a key, never runs by default",
    "anthropic: a live test against Anthropic",
    "openai: a live test against OpenAI",
    "google: a live test against Google Gemini",
]
filterwarnings = [
    # Raised inside Starlette's test client, not our code; remove once Starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
