# Local development stack. Every service is built into an image (no source bind mounts), so the
# same file works from the host, the Dev Container and CI. Start with `make up`.
name: firebid

x-backend-env: &backend-env
  FIREBID_ENV: dev
  FIREBID_LOG_LEVEL: INFO
  # The application connects as the restricted role (no UPDATE/DELETE on audit tables).
  FIREBID_DATABASE_URL: postgresql://firebid_app:firebid-app@postgres:5432/firebid
  # The service role crosses bids for scheduled work (deadline alerts, retention).
  FIREBID_DATABASE_SERVICE_URL: postgresql://firebid_service:firebid-service@postgres:5432/firebid
  # Tokens are issued for the browser's URL, but the API fetches the keys inside the network.
  FIREBID_OIDC_ISSUER: http://localhost:${FIREBID_KEYCLOAK_PORT:-8081}/realms/firebid
  FIREBID_OIDC_JWKS_URL: http://keycloak:8080/realms/firebid/protocol/openid-connect/certs
  FIREBID_OIDC_AUDIENCE: firebid-web
  # LLM provider credentials, taken from the host environment or infra/.env. Absent keys
  # simply mean that provider's routes cannot run; the stack still starts.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  FIREBID_S3_ENDPOINT_URL: http://seaweedfs:8333
  FIREBID_S3_BUCKET: firebid-dev
  FIREBID_S3_ACCESS_KEY_ID: firebid-dev
  FIREBID_S3_SECRET_ACCESS_KEY: firebid-dev-secret
  FIREBID_CLAMAV_HOST: clamav
  FIREBID_CLAMAV_PORT: "3310"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: firebid
      POSTGRES_PASSWORD: firebid
      POSTGRES_DB: firebid
    ports:
      - "${FIREBID_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firebid -d firebid"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    build: ./seaweedfs
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${FIREBID_S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    build: ./seaweedfs
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 30); do
          echo "s3.bucket.create -name firebid-dev" | weed shell -master=seaweedfs:9333 && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    environment:
      # Fetch signatures on start; without them clamd answers but detects nothing.
      CLAMAV_NO_FRESHCLAMD: "false"
    healthcheck:
      # clamd accepts connections long before the signature database is loaded, so the check
      # is PING over the scanning port rather than the port merely being open.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      # The first start downloads ~250 MB of signatures.
      start_period: 180s
    volumes:
      - clamdb:/var/lib/clamav

  keycloak:
    build: ./keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${FIREBID_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${FIREBID_KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      # Migrations run as the database owner and set up the application role.
      <<: *backend-env
      FIREBID_DATABASE_URL: postgresql://firebid:firebid@postgres:5432/firebid
      FIREBID_APP_DB_PASSWORD: firebid-app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    environment: *backend-env
    ports:
      - "${FIREBID_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../backend
    command: ["python", "-m", "firebid.jobs.worker"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      # Healthy once the heartbeat job (every minute) has run: proves jobs are being processed.
      test: ["CMD", "python", "-m", "firebid.jobs.healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ../frontend
      args:
        # The browser reaches Keycloak on the host, not inside the compose network.
        VITE_OIDC_AUTHORITY: "http://localhost:${FIREBID_KEYCLOAK_PORT:-8081}/realms/firebid"
        VITE_OIDC_CLIENT_ID: "firebid-web"
    ports:
      - "${FIREBID_WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
  clamdb:
