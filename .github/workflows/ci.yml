name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, API client, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          # Tesseract reads title blocks that have no text layer (FR-DOC-02).
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          uv sync --project backend --locked
          npm ci --prefix frontend --no-audit --no-fund
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Generated API client is up to date
        run: |
          make api-client
          git diff --exit-code -- frontend/src/api \
            || (echo "::error::Run 'make api-client' and commit the result." && exit 1)
      - name: Evaluation regression gate
        # The synthetic suite only. The private golden set runs manually or nightly, because
        # its data cannot be in CI (guardrail 8).
        run: make eval-gate

      - name: Requirement coverage report
        run: uv run --project backend python scripts/req_coverage.py --output reports/req-coverage.md
      - uses: actions/upload-artifact@v4
        with:
          name: req-coverage
          path: reports/req-coverage.md

  security:
    # NFR-06: every push is scanned; a high or critical finding fails the build.
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks reads the whole history
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependencies (pip-audit)
        run: |
          uv export --project backend --format requirements-txt --no-hashes --no-emit-project \
            --frozen > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      - name: npm dependencies (npm audit)
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm audit --prefix frontend --audit-level=high
      - name: Python code (Bandit)
        run: uvx bandit -r backend/src -q --severity-level high --confidence-level medium
      - name: Code (Semgrep)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --metrics off
          --config p/python --config p/typescript --config p/react --severity ERROR --error
          --exclude frontend/src/api/schema.d.ts backend/src frontend/src
      - name: Secrets in the history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo
          --redact --no-banner
      - name: Configuration and infrastructure as code (Trivy)
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --quiet --exit-code 1
          --severity HIGH,CRITICAL --scanners misconfig,secret --skip-dirs /repo/frontend/node_modules --skip-dirs /repo/backend/.venv --skip-files /repo/infra/keycloak/Dockerfile --skip-files /repo/infra/seaweedfs/Dockerfile /repo

  stack:
    name: Stack, integration and end-to-end tests
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --project backend --locked
          npm ci --prefix frontend --no-audit --no-fund
          npx --prefix frontend playwright install --with-deps chromium
      - name: Start the stack
        run: make up
      - name: Scan the images we build (Trivy)
        # High and critical vulnerabilities with a fix available fail the build (NFR-06).
        run: |
          for image in firebid-backend firebid-frontend firebid-sandbox; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --scanners vuln "$image"
          done
      - run: make test-integration
      - run: make e2e
      - name: Collect stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color > stack-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-logs
          path: stack-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
